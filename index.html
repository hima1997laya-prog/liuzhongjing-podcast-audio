<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刘仲敬 · 学习播客</title>
<style>
/* ============================================================
   参考风格：文心/品三国式阅读App
   三分区：音频条 + 播客文字 + 原文 · 同时可见
   暖色调小清新 · 大字版
   ============================================================ */

:root {
  --bg: #F5F0EB;
  --card-bg: #FFFFFF;
  --card-border: #E8E0D6;
  --text: #2C241A;
  --text-secondary: #7C6E5E;
  --text-muted: #B2A494;
  --accent: #C47A5A;
  --accent-light: #F5EDE6;
  --accent-dark: #A86142;
  --green: #7AAD94;
  --green-light: #EEF5F0;
  --coral: #D48A6A;
  --gold: #C4A46A;
  --cream: #FFFCF7;
  --shadow: rgba(140, 100, 60, 0.06);
  --radius: 14px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.9;
  font-size: 18px;
}

/* ===== 顶部头栏 ===== */
.top-bar {
  background: var(--accent);
  color: white;
  padding: 18px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}

.top-bar h1 {
  font-size: 1.2em;
  font-weight: 700;
  letter-spacing: 1px;
}

.top-bar .top-icons {
  display: flex;
  gap: 12px;
  font-size: 1.1em;
}

/* ===== 搜索栏 ===== */
.search-wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 12px 16px;
}

.search-wrap input {
  width: 100%;
  padding: 14px 18px;
  font-size: 1em;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  background: white;
  color: var(--text);
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
}

.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

.search-wrap input::placeholder {
  color: var(--text-muted);
}

/* ===== 主容器 ===== */
.container {
  max-width: 780px;
  margin: 0 auto;
  padding: 0 16px 80px;
}

/* ===== 卷标题 ===== */
.volume-section {
  margin-bottom: 4px;
}

.volume-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  margin: 12px 0 8px;
  cursor: pointer;
  user-select: none;
  background: white;
  border-radius: var(--radius-sm);
  border: 1px solid var(--card-border);
  transition: background 0.15s;
}

.volume-header:hover {
  background: var(--cream);
}

.volume-header .vol-num {
  background: var(--accent);
  color: white;
  font-size: 0.7em;
  font-weight: 700;
  padding: 2px 12px;
  border-radius: 14px;
}

.volume-header .vol-title {
  font-size: 0.9em;
  font-weight: 600;
  flex: 1;
}

.volume-header .vol-count {
  font-size: 0.75em;
  color: var(--text-muted);
}

.volume-header .vol-arrow {
  font-size: 0.75em;
  color: var(--text-muted);
  transition: transform 0.2s;
}

.volume-header.collapsed .vol-arrow {
  transform: rotate(-90deg);
}

.volume-body {
  padding-left: 2px;
}

/* ===== 文章卡片（三分区） ===== */
.article-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  margin-bottom: 18px;
  overflow: hidden;
  box-shadow: 0 1px 4px var(--shadow);
}

/* 文章头 */
.article-header {
  padding: 18px 22px 0;
}

.article-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.75em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.article-meta .tag {
  background: var(--accent-light);
  color: var(--accent);
  padding: 1px 10px;
  border-radius: 10px;
  font-weight: 500;
}

.article-title {
  font-size: 1.25em;
  font-weight: 700;
  line-height: 1.4;
  color: var(--text);
  margin-bottom: 12px;
}

/* ---- 分区1: 音频条 ---- */
.audio-section {
  padding: 0 22px 6px;
}

.audio-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--cream);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  border: 1px solid var(--card-border);
}

.play-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 1.2em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.1s;
  box-shadow: 0 2px 8px rgba(196, 122, 90, 0.3);
}

.play-btn:hover { background: var(--accent-dark); }
.play-btn:active { transform: scale(0.93); }

.audio-meta {
  flex: 1;
  min-width: 0;
}

.audio-label {
  font-size: 0.72em;
  color: var(--accent);
  font-weight: 500;
  margin-bottom: 2px;
}

.progress-track {
  width: 100%;
  height: 5px;
  background: rgba(196, 122, 90, 0.15);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  margin: 4px 0;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.7em;
  color: var(--text-muted);
}

/* 隐藏原生audio */
.article-audio audio { display: none; }

/* ---- 分区2: 播客文字 ---- */
.section-divider {
  height: 1px;
  background: var(--card-border);
  margin: 0 22px;
}

.text-section {
  padding: 14px 22px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.section-header .label-icon {
  font-size: 1.1em;
}

.section-header .label-text {
  font-size: 0.85em;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.label-podcast {
  color: var(--green);
}

.label-original {
  color: var(--accent);
}

.text-body {
  font-size: 1em;
  line-height: 2;
  color: var(--text);
  max-height: 260px;
  overflow-y: auto;
  padding-right: 6px;
}

.text-body::-webkit-scrollbar { width: 4px; }
.text-body::-webkit-scrollbar-thumb {
  background: var(--card-border);
  border-radius: 2px;
}

.text-body p {
  margin-bottom: 12px;
}

.text-empty {
  text-align: center;
  padding: 28px 0;
  color: var(--text-muted);
  font-style: italic;
}

.text-empty .big-icon {
  font-size: 1.8em;
  display: block;
  margin-bottom: 8px;
}

/* ---- 分区3: 原文 ---- */
.text-section:last-child {
  border-bottom: none;
}

/* ===== 页脚 ===== */
.footer {
  text-align: center;
  padding: 40px 20px 20px;
  color: var(--text-muted);
  font-size: 0.8em;
}

.footer a {
  color: var(--accent);
  text-decoration: none;
}

/* ===== 回到顶部 ===== */
.back-top {
  position: fixed;
  bottom: 24px;
  right: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: white;
  color: var(--text-secondary);
  border: 1px solid var(--card-border);
  font-size: 1em;
  cursor: pointer;
  box-shadow: 0 2px 8px var(--shadow);
  display: none;
  z-index: 100;
  transition: all 0.2s;
}

.back-top:hover {
  transform: translateY(-2px);
  box-shadow: 0 3px 12px rgba(140, 100, 60, 0.12);
}

/* ===== 加载 ===== */
.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid var(--card-border);
  border-top: 3px solid var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 响应式 ===== */
@media (max-width: 600px) {
  body { font-size: 16px; }
  .top-bar { padding: 14px 14px 10px; }
  .top-bar h1 { font-size: 1em; }
  .container { padding: 0 6px 60px; }
  .search-wrap { padding: 8px 10px; }
  .search-wrap input { padding: 12px 14px; font-size: 0.95em; }
  .article-header { padding: 14px 14px 0; }
  .article-title { font-size: 1.1em; }
  .audio-section { padding: 0 14px 4px; }
  .audio-bar { padding: 10px 12px; gap: 10px; }
  .play-btn { width: 42px; height: 42px; font-size: 1.1em; }
  .text-section { padding: 12px 14px; }
  .section-divider { margin: 0 14px; }
  .volume-header { padding: 10px 12px; }
}
</style>
</head>
<body>

<!-- 顶部 -->
<div class="top-bar">
  <h1>📖 刘仲敬播客</h1>
  <div class="top-icons">
    <span>🔍</span>
    <span>⚙</span>
  </div>
</div>

<!-- 搜索 -->
<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="🔍 搜索文章标题..." oninput="filterVolumes()">
</div>

<!-- 主内容 -->
<div class="container">
  <div id="content">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在加载音频列表...</p>
    </div>
  </div>

  <footer class="footer">
    <p>🐉 龙一 · 🍎 龙五 · 零token本地生成</p>
    <p style="margin-top:4px;"><a href="https://xuexi.familyzhou.cn">xuexi.familyzhou.cn</a> · 2026</p>
  </footer>
</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ============================================================
// 数据
// ============================================================

let audioData = {};

fetch('manifest.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(d => { audioData = d; render(d); })
  .catch(() => { render({"01_论国史":{"第一卷_壹_论国史":"刘仲敬_第一卷_壹_论国史.mp3"}}); });

function render(data) {
  const c = document.getElementById('content');
  c.innerHTML = '';

  const entries = Object.entries(data);
  if (!entries.length) { c.innerHTML = '<div class="loading"><p>暂无内容</p></div>'; return; }

  function volNum(k) { const m = k.match(/^Vol?(\d+)/i); return m ? parseInt(m[1]) : 99; }
  function volName(k) { return k.replace(/^Vol/i,'').replace(/_/g,' ').trim(); }

  entries.sort((a,b) => volNum(a[0]) - volNum(b[0]) || a[0].localeCompare(b[0]));

  let gid = 0, html = '';

  for (const [vk, items] of entries) {
    const vn = volName(vk), num = volNum(vk), ientries = Object.entries(items);
    const shortVn = vn.length > 32 ? vn.slice(0,30)+'…' : vn;

    html += `<div class="volume-section">
      <div class="volume-header" onclick="toggle(this)">
        <span class="vol-num">卷${num}</span>
        <span class="vol-title">${shortVn}</span>
        <span class="vol-count">${ientries.length}集</span>
        <span class="vol-arrow">▼</span>
      </div>
      <div class="volume-body">`;

    for (const [title, mp3] of ientries) {
      gid++;
      const path = vk + '/' + encodeURIComponent(mp3);
      const id = 'a' + gid;
      let st = title.replace(/^(Vol\d+[_\s])+/i,'').replace(/_/g,' ').replace(/刘仲敬/g,'').trim();
      st = st.replace(/^[_\s·\.]+/,'').trim();

      html += `
      <div class="article-card">
        <div class="article-header">
          <div class="article-meta">
            <span class="tag">卷${num}</span>
            <span>原文朗读 + 白话讲解</span>
          </div>
          <div class="article-title">${st}</div>
        </div>

        <!-- 分区1: 音频 -->
        <div class="audio-section">
          <div class="audio-bar">
            <button class="play-btn" id="pb${id}" onclick="tp('${id}')">▶</button>
            <div class="audio-meta">
              <div class="audio-label">🎧 点击播放</div>
              <div class="progress-track" id="pt${id}" onclick="sk(event, '${id}')">
                <div class="progress-fill" id="pf${id}"></div>
              </div>
              <div class="time-row">
                <span id="cu${id}">0:00</span>
                <span id="du${id}">--:--</span>
              </div>
            </div>
          </div>
          <audio id="${id}" preload="none" onplay="onp('${id}')" onpause="onpp('${id}')" ontimeupdate="otu('${id}')" onloadedmetadata="omd('${id}')" onended="one('${id}')">
            <source src="${path}" type="audio/mpeg">
          </audio>
        </div>

        <!-- 分隔线 -->
        <div class="section-divider"></div>

        <!-- 分区2: 播客文字 -->
        <div class="text-section">
          <div class="section-header">
            <span class="label-icon">🎙️</span>
            <span class="label-text label-podcast">播客讲解</span>
          </div>
          <div class="text-body">
            <div class="text-empty">
              <span class="big-icon">📝</span>
              讲解文字待整理
            </div>
          </div>
        </div>

        <!-- 分隔线 -->
        <div class="section-divider"></div>

        <!-- 分区3: 原文 -->
        <div class="text-section">
          <div class="section-header">
            <span class="label-icon">📜</span>
            <span class="label-text label-original">原文</span>
          </div>
          <div class="text-body">
            <div class="text-empty">
              <span class="big-icon">📄</span>
              原文文字待整理
            </div>
          </div>
        </div>
      </div>`;
    }

    html += `</div></div>`;
  }

  c.innerHTML = html;
}

// ======== 交互 ========

function toggle(h) {
  h.classList.toggle('collapsed');
  const b = h.nextElementSibling;
  if (b) b.style.display = b.style.display === 'none' ? '' : 'none';
}

function filterVolumes() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.volume-section').forEach(s => {
    const volTitle = s.querySelector('.vol-title').textContent.toLowerCase();
    const cards = s.querySelectorAll('.article-card');
    let match = q === '';
    cards.forEach(c => {
      const t = c.querySelector('.article-title').textContent.toLowerCase();
      const m = q === '' || volTitle.includes(q) || t.includes(q);
      c.style.display = m ? '' : 'none';
      if (m) match = true;
    });
    s.style.display = match ? '' : 'none';
    if (q) { const b = s.querySelector('.volume-body'); if (b) b.style.display = ''; }
  });
}

// 音频控制
function tp(id) {
  const a = document.getElementById(id);
  if (!a) return;
  a.paused ? a.play() : a.pause();
}
function onp(id) { const b = document.getElementById('pb'+id); if (b) b.textContent = '⏸'; }
function onpp(id) { const b = document.getElementById('pb'+id); if (b) b.textContent = '▶'; }
function one(id) {
  const b = document.getElementById('pb'+id); if (b) b.textContent = '▶';
  const f = document.getElementById('pf'+id); if (f) f.style.width = '0%';
  const c = document.getElementById('cu'+id); if (c) c.textContent = '0:00';
}
function otu(id) {
  const a = document.getElementById(id); if (!a || !a.duration) return;
  const f = document.getElementById('pf'+id); if (f) f.style.width = (a.currentTime / a.duration * 100) + '%';
  const c = document.getElementById('cu'+id); if (c) c.textContent = fm(a.currentTime);
}
function omd(id) {
  const a = document.getElementById(id); if (!a) return;
  const d = document.getElementById('du'+id); if (d) d.textContent = fm(a.duration);
}
function sk(e, id) {
  e.stopPropagation();
  const a = document.getElementById(id); if (!a || !a.duration) return;
  const bar = document.getElementById('pt'+id); if (!bar) return;
  const r = bar.getBoundingClientRect();
  a.currentTime = ((e.clientX - r.left) / r.width) * a.duration;
}
function fm(s) {
  if (!s || isNaN(s)) return '--:--';
  return Math.floor(s/60) + ':' + (Math.floor(s%60) < 10 ? '0' : '') + Math.floor(s%60);
}

// 回到顶部
window.addEventListener('scroll', () => {
  const b = document.getElementById('backTop');
  if (b) b.style.display = window.scrollY > 400 ? 'block' : 'none';
});
</script>
</body>
</html>
