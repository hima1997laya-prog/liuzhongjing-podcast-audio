<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我成长学堂</title>
<style>
/* ============================================================
   参考风格：纯阅读App · 无框无装饰
   文字即内容 · 暖色底 · 大字版
   ============================================================ */

:root {
  --bg: #FFB300;
  --text: #2C241A;
  --text-soft: #7C6E5E;
  --text-light: #B2A494;
  --accent: #C47A5A;
  --accent-light: #FAF2EC;
  --accent-border: #E8DCD2;
  --green: #7AAD94;
  --green-light: #F0F7F3;
  --cream: #FFFCF7;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', serif;
  background: var(--bg);
  color: var(--text);
  line-height: 2;
  font-size: 36px;
}

/* ===== 顶部 ===== */
.top-bar {
  background: var(--accent);
  color: white;
  padding: 18px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}

.top-bar h1 {
  font-size: 1em;
  font-weight: 700;
  letter-spacing: 1px;
}

/* ===== 搜索 ===== */
.search-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px 20px 8px;
}

.search-wrap input {
  width: 100%;
  padding: 14px 18px;
  font-size: 0.7em;
  border: 1px solid var(--accent-border);
  border-radius: var(--radius-sm);
  background: white;
  color: var(--text);
  outline: none;
  transition: border 0.2s;
}

.search-wrap input:focus {
  border-color: var(--accent);
}

.search-wrap input::placeholder {
  color: var(--text-light);
}

/* ===== 主容器 ===== */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* ===== 卷标题 ===== */
.volume-section {
  margin-bottom: 4px;
}

.volume-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 16px;
  margin: 16px 0 12px;
  cursor: pointer;
  user-select: none;
  background: white;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-border);
  transition: background 0.15s;
}

.volume-header:hover {
  background: var(--cream);
}

.volume-header .vol-num {
  background: var(--accent);
  color: white;
  font-size: 0.5em;
  font-weight: 700;
  padding: 2px 12px;
  border-radius: 14px;
}

.volume-header .vol-title {
  font-size: 0.7em;
  font-weight: 600;
  flex: 1;
}

.volume-header .vol-count {
  font-size: 0.55em;
  color: var(--text-light);
}

.volume-header .vol-arrow {
  font-size: 0.55em;
  color: var(--text-light);
  transition: transform 0.2s;
}

.volume-header.collapsed .vol-arrow {
  transform: rotate(-90deg);
}

.volume-body {
  padding-left: 2px;
}

/* ===== 文章（无框无装饰） ===== */
.article {
  margin-bottom: 32px;
}

/* 文章头部 */
.article-head {
  margin-bottom: 8px;
}

.article-head .article-tag {
  font-size: 0.5em;
  color: var(--text-light);
  margin-bottom: 4px;
}

.article-head .article-title {
  font-size: 1.1em;
  font-weight: 700;
  line-height: 1.4;
  color: var(--text);
  margin-bottom: 10px;
}

/* ---- 音频条（轻量） ---- */
.audio-line {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 0;
  margin-bottom: 4px;
}

.play-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 1.8em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.1s;
  box-shadow: 0 2px 10px rgba(196, 122, 90, 0.25);
}

.play-btn:hover { background: #A86142; }
.play-btn:active { transform: scale(0.93); }

.audio-info {
  flex: 1;
  min-width: 0;
}

.audio-label {
  font-size: 0.5em;
  color: var(--text-soft);
  margin-bottom: 4px;
}

.progress-track {
  width: 100%;
  height: 6px;
  background: var(--accent-border);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  margin: 4px 0;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
}

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.5em;
  color: var(--text-light);
}

.article audio { display: none; }

/* ---- 正文 ---- */
.section-label {
  font-size: 0.55em;
  font-weight: 600;
  color: var(--text-light);
  margin: 16px 0 8px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.section-label .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.dot-green { background: var(--green); }
.dot-coral { background: var(--accent); }

.text-body {
  font-size: 0.85em;
  line-height: 2.1;
  color: var(--text);
}

.text-body p {
  margin-bottom: 14px;
  text-indent: 2em;
}

.text-body p:first-child {
  text-indent: 0;
}

.text-empty {
  text-align: center;
  padding: 32px 0;
  color: var(--text-light);
  font-style: italic;
  font-size: 0.65em;
}

.text-empty .icon {
  font-size: 1.3em;
  display: block;
  margin-bottom: 8px;
}

/* ===== 页脚 ===== */
.footer {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
  font-size: 0.45em;
}

/* ===== 回到顶部 ===== */
.back-top {
  position: fixed;
  bottom: 24px;
  right: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: white;
  color: var(--text-soft);
  border: 1px solid var(--accent-border);
  font-size: 0.5em;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  display: none;
  z-index: 100;
}

/* ===== 加载 ===== */
.loading {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-light);
}

.spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid var(--accent-border);
  border-top: 3px solid var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 响应式 ===== */
@media (max-width: 600px) {
  body { font-size: 22px; }
  .top-bar { padding: 14px 14px 10px; }
  .top-bar h1 { font-size: 0.85em; }
  .container { padding: 0 12px 60px; }
  .search-wrap { padding: 10px 12px 4px; }
  .play-btn { width: 56px; height: 56px; font-size: 1.4em; }
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>📖 自我成长学堂</h1>
  <span>🔍</span>
</div>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="🔍 搜索文章..." oninput="filterVolumes()">
</div>

<div class="container">
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
  </div>
  <footer class="footer">
    <p>🐉 龙一 · 🍎 龙五 · 零token本地生成</p>
    <p style="margin-top:2px;">xuexi.familyzhou.cn</p>
  </footer>
</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
let audioData = {};

fetch('manifest.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(d => { audioData = d; render(d); })
  .catch(() => { render({"01_论国史":{"第一卷_壹_论国史":"刘仲敬_第一卷_壹_论国史.mp3"}}); });

function render(data) {
  const c = document.getElementById('content');
  c.innerHTML = '';
  const entries = Object.entries(data);
  if (!entries.length) { c.innerHTML = '<div class="loading"><p>暂无内容</p></div>'; return; }

  function volNum(k) { const m = k.match(/^Vol?(\d+)/i); return m ? parseInt(m[1]) : 99; }
  function volName(k) { return k.replace(/^Vol/i,'').replace(/_/g,' ').replace(/刘仲敬/g,'').trim(); }

  entries.sort((a,b) => volNum(a[0]) - volNum(b[0]) || a[0].localeCompare(b[0]));
  let gid = 0, html = '';

  for (const [vk, items] of entries) {
    const vn = volName(vk), num = volNum(vk), ientries = Object.entries(items);
    const shortVn = vn.length > 32 ? vn.slice(0,30)+'…' : vn;

    html += `<div class="volume-section">
      <div class="volume-header" onclick="toggle(this)">
        <span class="vol-num">卷${num}</span>
        <span class="vol-title">${shortVn}</span>
        <span class="vol-count">${ientries.length}篇</span>
        <span class="vol-arrow">▼</span>
      </div>
      <div class="volume-body">`;

    for (const [title, mp3] of ientries) {
      gid++;
      const path = vk + '/' + encodeURIComponent(mp3);
      const id = 'a' + gid;
      let st = title.replace(/^(Vol\d+[_\s])+/i,'').replace(/_/g,' ').replace(/刘仲敬/g,'').trim();
      st = st.replace(/^[_\s·\.]+/,'').trim();

      html += `
      <div class="article">
        <div class="article-head">
          <div class="article-tag">📚 卷${num} · 原文+讲解</div>
          <div class="article-title">${st}</div>
        </div>

        <div class="audio-line">
          <button class="play-btn" id="pb${id}" onclick="tp('${id}')">▶</button>
          <div class="audio-info">
            <div class="audio-label">点击播放</div>
            <div class="progress-track" id="pt${id}" onclick="sk(event,'${id}')">
              <div class="progress-fill" id="pf${id}"></div>
            </div>
            <div class="time-row">
              <span id="cu${id}">0:00</span>
              <span id="du${id}">--:--</span>
            </div>
          </div>
        </div>

        <audio id="${id}" preload="none" onplay="onp('${id}')" onpause="onpp('${id}')" ontimeupdate="otu('${id}')" onloadedmetadata="omd('${id}')" onended="one('${id}')">
          <source src="${path}" type="audio/mpeg">
        </audio>

        <div class="section-label">
          <span class="dot dot-green"></span>
          播客讲解
        </div>
        <div class="text-body">
          <div class="text-empty">
            <span class="icon">🎙️</span>
            讲解文字待整理
          </div>
        </div>

        <div class="section-label">
          <span class="dot dot-coral"></span>
          原文
        </div>
        <div class="text-body">
          <div class="text-empty">
            <span class="icon">📜</span>
            原文文字待整理
          </div>
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }
  c.innerHTML = html;
}

function toggle(h) {
  h.classList.toggle('collapsed');
  const b = h.nextElementSibling;
  if (b) b.style.display = b.style.display === 'none' ? '' : 'none';
}

function filterVolumes() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.volume-section').forEach(s => {
    const vt = s.querySelector('.vol-title').textContent.toLowerCase();
    const cards = s.querySelectorAll('.article');
    let match = q === '';
    cards.forEach(c => {
      const t = c.querySelector('.article-title').textContent.toLowerCase();
      const m = q === '' || vt.includes(q) || t.includes(q);
      c.style.display = m ? '' : 'none';
      if (m) match = true;
    });
    s.style.display = match ? '' : 'none';
    if (q) { const b = s.querySelector('.volume-body'); if (b) b.style.display = ''; }
  });
}

function tp(id) { const a=document.getElementById(id); if(!a)return; a.paused?a.play():a.pause(); }
function onp(id) { const b=document.getElementById('pb'+id); if(b)b.textContent='⏸'; }
function onpp(id) { const b=document.getElementById('pb'+id); if(b)b.textContent='▶'; }
function one(id) {
  const b=document.getElementById('pb'+id); if(b)b.textContent='▶';
  const f=document.getElementById('pf'+id); if(f)f.style.width='0%';
  const c=document.getElementById('cu'+id); if(c)c.textContent='0:00';
}
function otu(id) {
  const a=document.getElementById(id); if(!a||!a.duration)return;
  const f=document.getElementById('pf'+id); if(f)f.style.width=(a.currentTime/a.duration*100)+'%';
  const c=document.getElementById('cu'+id); if(c)c.textContent=fm(a.currentTime);
}
function omd(id) { const a=document.getElementById(id); if(!a)return; const d=document.getElementById('du'+id); if(d)d.textContent=fm(a.duration); }
function sk(e,id) {
  e.stopPropagation();
  const a=document.getElementById(id); if(!a||!a.duration)return;
  const bar=document.getElementById('pt'+id); if(!bar)return;
  const r=bar.getBoundingClientRect();
  a.currentTime=((e.clientX-r.left)/r.width)*a.duration;
}
function fm(s) { if(!s||isNaN(s))return'--:--'; return Math.floor(s/60)+':'+(Math.floor(s%60)<10?'0':'')+Math.floor(s%60); }

window.addEventListener('scroll', () => {
  const b=document.getElementById('backTop');
  if(b)b.style.display=window.scrollY>400?'block':'none';
});
</script>
</body>
</html>
